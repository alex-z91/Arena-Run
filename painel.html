<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas corridas · Arena Run</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{font-family:Inter,system-ui,sans-serif;background:#f5f7f5;color:#192b22}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:#fff;border-bottom:1px solid #e2e9e2}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;letter-spacing:-1.5px;font-size:25px;color:#172820;text-decoration:none}.brand span{color:#46916d}a{color:#326e53}button,.btn{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:700;background:#b8f230;color:#172820;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#edf3ed}.muted{color:#6a7a6e}.eyebrow{font-size:12px;letter-spacing:.12em;color:#4a8061;font-weight:750}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;padding:30px 0 8px}.hero h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.05em;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panel{background:#fff;border:1px solid #e1e9e2;border-radius:15px;padding:22px;margin:14px 0}.metric b{display:block;font-size:30px;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}.tabs button{background:#eaf0ea}.tabs button.active{background:#182f24;color:#fff}.entry{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-top:1px solid #e6ece7}.entry h3{margin:6px 0;font-size:19px}.meta{font-size:13px;color:#67766b;line-height:1.8}.number{font-size:12px;font-weight:700;color:#3d7054}.status{border-radius:99px;background:#fff0d5;color:#8e5c18;padding:7px 11px;display:inline-block;font-size:12px;font-weight:750}.status.paid{background:#e6f6dd;color:#3b6f2e}.status.cancel{background:#edf0ee;color:#616c62}.right{text-align:right;min-width:170px}.empty{padding:32px;text-align:center;color:#6b796e}.error{padding:15px;background:#ffe8e4;border-radius:10px;color:#96392b;margin:20px 0}.hidden{display:none!important}footer{padding:30px 0;color:#78877c;font-size:12px}@media(max-width:740px){.metrics{grid-template-columns:repeat(2,1fr)}.hero{display:block}.entry{align-items:flex-start;flex-direction:column}.right{text-align:left;min-width:0}.panel{padding:16px}.top{flex-wrap:wrap}}.metric-action{cursor:pointer;text-align:left;background:#dcf8a4!important;color:#26411c!important;border:1px solid #aedf62!important;transition:transform .15s ease}.metric-action:hover{transform:translateY(-2px)}.metric-action small{display:block;font-size:12px;color:#42662c}.metric-neutral{background:#edf2ee}.metric-warning{background:#fff0d9;border-color:#f2dcaf}.metric-warning b{color:#8d5c1c}.metric-good{background:#e4f5e4;border-color:#c9e9ce}.metric-good b{color:#287546}.entries-panel{border:2px solid #dce9de}.entries-panel h2{color:#255c42}.entry{background:#f7faf7;border:1px solid #e3ece4;border-radius:11px;margin:10px 0;padding:18px}.history-label{display:block;color:#7b867a;font-size:11px;margin-top:8px}.metrics button.metric{font:inherit}.metrics .metric{display:flex!important;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:132px;text-align:left}.metric span{font-size:13px;font-weight:650}.metric b{font-size:30px;line-height:1.1}.metric-clickable{cursor:pointer!important}.metric-clickable:hover{filter:brightness(.97)}#pendingCard[hidden]{display:none!important}.metrics button{width:100%}/* Arena Run · typographic system */
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:14px;line-height:1.55;font-weight:400;letter-spacing:-.008em}
h1,h2,h3{font-family:inherit;font-weight:600!important;letter-spacing:-.035em!important;line-height:1.18}
h1{font-weight:600!important}h2{font-weight:600!important}h3{font-weight:600!important}
p,.muted,.fieldnote,.help{font-weight:400;line-height:1.6}
label,legend{font-size:13px;font-weight:500!important;letter-spacing:0}
button,.btn,.cta,.btnlink,.dark,.primary,.secondary,.light,.choice,.distance-option{font-weight:600!important;letter-spacing:-.01em}
input,select,textarea{font-weight:400;letter-spacing:0;font-size:14px}
strong,b{font-weight:600}
.brand{font-weight:700!important;letter-spacing:-.055em!important}
.eyebrow,.step{font-weight:600!important;letter-spacing:.08em!important}
.metric b,.price{font-weight:600!important;letter-spacing:-.04em}
.raceInner h3,.entry h3{font-weight:600!important}
.status,.pill,.chip,.badge{font-weight:500!important}
.entry-open{cursor:pointer;transition:background .15s,border-color .15s}.entry-open:hover,.entry-open:focus-visible{background:#edf6ec;border-color:#a4c9a8;outline:none}.entry-open::after{content:'Ver detalhes →';font-size:12px;font-weight:600;color:#2d7350;align-self:center}.details-overlay{position:fixed;inset:0;background:#12251bb5;display:flex;justify-content:center;align-items:center;padding:16px;z-index:30}.details-dialog{background:#fff;width:min(100%,580px);max-height:90dvh;overflow-y:auto;border-radius:16px;padding:24px;box-shadow:0 20px 60px #0003}.dialog-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.dialog-top h2{margin:8px 0 16px}.detail-line{border-bottom:1px solid #e8efe9;padding:10px 0;display:flex;justify-content:space-between;gap:16px;font-size:13px}.detail-line span{color:#68786c}.detail-line strong{text-align:right;font-weight:600}.details-dialog>.btn{margin-top:20px}@media(max-width:520px){.details-dialog{padding:16px}.detail-line{flex-direction:column;gap:3px}.detail-line strong{text-align:left}.entry-open::after{align-self:flex-start}}</style></head><body><header><div class="wrap top"><a class="brand" href="/">arena<span>run</span></a><div><a class="btn secondary" href="/">Explorar corridas</a> <button class="secondary" onclick="logout()">Sair</button></div></div></header><main class="wrap"><div class="hero"><div><span class="eyebrow">PAINEL DO ATLETA</span><h1 id="welcome">Minhas corridas</h1><p class="muted" id="profile">Carregando sua área...</p></div><a class="btn" href="/">Encontrar uma corrida ↗</a></div><div id="error" class="error hidden" role="alert"></div><div class="metrics"><button class="panel metric metric-action" type="button" onclick="document.getElementById('entriesSection').scrollIntoView({behavior:'smooth'})"><span>Minhas inscrições ↗</span><b id="total">—</b><small>Acompanhar inscrições</small></button><div class="panel metric metric-neutral"><span class="muted">Próximas provas</span><b id="upcoming">—</b></div><button id="pendingCard" class="panel metric metric-warning metric-clickable" type="button" onclick="document.getElementById('entriesSection').scrollIntoView({behavior:'smooth'})"><span>Pagamentos pendentes ↗</span><b id="pending">—</b></button></div><section class="panel entries-panel" id="entriesSection"><h2 id="sectionTitle">Minhas inscrições</h2><div id="list" aria-live="polite">Consultando suas inscrições...</div></section><p class="muted" style="font-size:12px">Eventos anteriores não comprovam participação ou conclusão da prova.</p></main><footer class="wrap">Arena Run · Área exclusiva do atleta</footer><script src="config.js"></script><script>
'use strict';const $=id=>document.getElementById(id),BASE=window.ARENA_API_URL||'';let entries=[];
const token=sessionStorage.getItem('arena_run_auth_token');if(!token)location.replace('/login.html');
function err(t){$('error').textContent=t;$('error').classList.remove('hidden')}
function logout(){sessionStorage.removeItem('arena_run_auth_token');location.replace('/login.html')}
async function get(path){const res=await fetch(BASE+'/api'+path,{headers:{Authorization:'Bearer '+token}});const obj=await res.json().catch(()=>({}));if(res.status===401||res.status===403){logout();throw Error('Sessão expirada')}if(!res.ok)throw Error(obj.error||'Falha ao carregar inscrições');return obj}
function when(s){if(!s)return 'Data a confirmar';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function render(){const today=new Date().toISOString().slice(0,10);const current=entries.slice();const root=$('list');root.replaceChildren();if(!current.length){const p=document.createElement('div');p.className='empty';p.textContent='Você ainda não tem inscrições registradas.';root.append(p);return}current.sort((a,b)=>b.date.localeCompare(a.date));for(const x of current){const box=document.createElement('article');box.className='entry entry-open';box.tabIndex=0;box.setAttribute('role','button');box.setAttribute('aria-label','Ver detalhes da inscrição '+String(x.id).padStart(6,'0'));box.addEventListener('click',()=>openDetails(x));box.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetails(x)}});const left=document.createElement('div'),right=document.createElement('div');right.className='right';const number=document.createElement('div');number.className='number';number.textContent='INSCRIÇÃO Nº '+String(x.id).padStart(6,'0');const h=document.createElement('h3');h.textContent=x.race;const meta=document.createElement('div');meta.className='meta';meta.textContent=[when(x.date),x.city,x.distance,x.category,x.locality==='local'?'Categoria local':x.locality==='general'?'Categoria geral':null].filter(Boolean).join(' · ');left.append(number,h,meta);if(x.date<today){const past=document.createElement('small');past.className='history-label';past.textContent='Evento anterior · participação não verificada';left.append(past)}const st=document.createElement('span');st.className='status';if(x.status==='paid'){st.classList.add('paid');st.textContent='Pago'}else if(x.status==='paid_simulated'){st.classList.add('paid');st.textContent='Pago (simulado)'}else if(x.status==='awaiting_payment'){st.textContent='Aguardando pagamento'}else{st.classList.add('cancel');st.textContent=x.status==='canceled'?'Cancelada':x.status}const price=document.createElement('p');price.className='meta';price.textContent=Number.isFinite(x.price_cents)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(x.price_cents/100):'';right.append(st,price);box.append(left,right);root.append(box)}}
function localDateTime(value){if(!value)return 'Não registrado';const d=new Date(value);return Number.isNaN(d.getTime())?'Não registrado':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusText(s){return s==='paid'?'Inscrição confirmada':s==='paid_simulated'?'Pago (simulado)':s==='awaiting_payment'?'Aguardando pagamento':s==='canceled'?'Cancelada':s||'Não informado'}
function openDetails(x){const box=$('detailsBody');box.replaceChildren();$('detailsTitle').textContent=x.race;const items=[['Nº da inscrição',String(x.id).padStart(6,'0')],['Prova',x.race],['Data da prova',when(x.date)],['Cidade',x.city||'Não informada'],['Distância',x.distance],['Categoria',x.category||'Não definida'],['Classificação',x.locality==='local'?'Local':x.locality==='general'?'Geral':'Não definida'],['Equipe / assessoria',x.team||'Não informada'],['Tamanho da camiseta',x.shirt_size],['Valor',Number.isFinite(x.price_cents)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(x.price_cents/100):'—'],['Status',statusText(x.status)],['Confirmação da inscrição',x.status==='paid'&&x.paid_at?localDateTime(x.paid_at):x.status==='paid_simulated'?'Confirmação simulada':'Aguardando pagamento'],['Aceite do regulamento',x.regulation_accepted_at?localDateTime(x.regulation_accepted_at):'Não registrado']];for(const [label,value]of items){const line=document.createElement('div');line.className='detail-line';const k=document.createElement('span');k.textContent=label;const v=document.createElement('strong');v.textContent=value||'—';line.append(k,v);box.append(line)}$('detailsOverlay').classList.remove('hidden');$('closeDetails').focus();document.body.style.overflow='hidden'}
function closeDetails(){$('detailsOverlay').classList.add('hidden');document.body.style.overflow=''}
$('closeDetails').onclick=closeDetails;$('doneDetails').onclick=closeDetails;$('detailsOverlay').addEventListener('click',e=>{if(e.target===$('detailsOverlay'))closeDetails()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('detailsOverlay').classList.contains('hidden'))closeDetails()});
async function load(){if(!BASE||!token)return;try{const [me,data]=await Promise.all([get('/me'),get('/registrations/me')]);if(me.role!=='runner'){logout();return}$('welcome').textContent='Olá, '+me.name.split(' ')[0]+'!';$('profile').textContent=[me.city,me.email].filter(Boolean).join(' · ');entries=data.registrations||[];const now=new Date().toISOString().slice(0,10);$('total').textContent=entries.length;$('upcoming').textContent=entries.filter(x=>x.date>=now&&x.status!=='canceled').length;$('pending').textContent=entries.filter(x=>x.status==='awaiting_payment').length;$('pendingCard').hidden=entries.filter(x=>x.status==='awaiting_payment').length===0;render()}catch(e){err(e.message)}}load();
</script></body></html>
