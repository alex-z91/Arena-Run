<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Área · Arena Run</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{font-family:Inter,system-ui,sans-serif;color:#172820;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:930px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #dce5de;padding:15px 0}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;text-decoration:none;color:#172820}.brand span{color:#44866a}a{color:#397552}button,input{font:inherit}input{width:100%;padding:13px;border:1px solid #d5dfd6;border-radius:10px;margin:7px 0 16px}label{display:block;font-size:13px;font-weight:700}button,.cta{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;background:#b8f230;color:#172820;font-weight:750;text-decoration:none;display:inline-block}button.secondary{background:#ecf2ed}button:disabled{opacity:.6}.panel{background:#fff;border:1px solid #e0e9e1;border-radius:15px;padding:25px;margin:18px 0}.login{max-width:470px;margin:45px auto}.muted{color:#667a6d}.message{background:#ffede8;color:#9a332c;padding:12px;border-radius:9px;margin:15px 0}.ok{background:#eaf6df;color:#366423}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric b{display:block;font-size:30px;margin-top:9px}.entry{border-top:1px solid #e3ebe3;padding:16px 0}.entry h3{margin:0 0 7px}#dashboard[hidden],#loginSection[hidden]{display:none}footer{font-size:12px;color:#778678;padding:25px 0}@media(max-width:620px){.grid{grid-template-columns:1fr}.login{margin:22px auto}}/* Arena Run · typographic system */
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:14px;line-height:1.55;font-weight:400;letter-spacing:-.008em}
h1,h2,h3{font-family:inherit;font-weight:600!important;letter-spacing:-.035em!important;line-height:1.18}
h1{font-weight:600!important}h2{font-weight:600!important}h3{font-weight:600!important}
p,.muted,.fieldnote,.help{font-weight:400;line-height:1.6}
label,legend{font-size:13px;font-weight:500!important;letter-spacing:0}
button,.btn,.cta,.btnlink,.dark,.primary,.secondary,.light,.choice,.distance-option{font-weight:600!important;letter-spacing:-.01em}
input,select,textarea{font-weight:400;letter-spacing:0;font-size:14px}
strong,b{font-weight:600}
.brand{font-weight:700!important;letter-spacing:-.055em!important}
.eyebrow,.step{font-weight:600!important;letter-spacing:.08em!important}
.metric b,.price{font-weight:600!important;letter-spacing:-.04em}
.raceInner h3,.entry h3{font-weight:600!important}
.status,.pill,.chip,.badge{font-weight:500!important}
</style></head><body><div class="wrap"><header><a href="/" class="brand">arena<span>run</span></a><a href="/">← Corridas</a></header><div id="message" role="alert"></div><section id="loginSection" class="panel login" hidden><p class="muted">ACESSO DO ATLETA</p><h1>Entrar na Minha Área</h1><p class="muted">Acompanhe suas inscrições e o status dos pagamentos.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar ↗</button></form><p class="muted">Primeira corrida? <a href="/">Encontre sua prova e faça o cadastro</a>.</p></section><section id="dashboard" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><p class="muted">PAINEL DO ATLETA</p><h1 id="welcome">Minha Área</h1><p class="muted" id="profile"></p></div><button class="secondary" onclick="logout()">Sair</button></div><div class="grid"><div class="panel metric">Inscrições<b id="count">0</b></div><div class="panel metric">Pendentes<b id="pending">0</b></div><div class="panel metric">Pagas<b id="paid">0</b></div></div><div class="panel"><h2>Minhas inscrições</h2><div id="entries"></div></div><a class="cta" href="/">Ver corridas ↗</a></section><footer>Arena Run · Área do atleta</footer></div><script src="config.js"></script><script>
'use strict';const $=id=>document.getElementById(id),BASE=window.ARENA_API_URL||'';let token='',user=null;
function msg(text,good=false){$('message').textContent=text;$('message').className=good?'message ok':'message'}
async function request(path,body){if(!BASE)throw Error('Serviço de autenticação indisponível.');const res=await fetch(BASE+'/api'+path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error||'Falha na solicitação');return j}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=Object.fromEntries(new FormData(e.target));const auth=await request('/auth/login',d);if(auth.user?.role!=='runner')throw Error('Esta página é exclusiva para atletas.');token=auth.token;user=auth.user;sessionStorage.setItem('arena_run_auth_token',token);location.replace('/painel.html')}catch(err){token='';user=null;msg(err.message)}finally{b.disabled=false}};
async function load(){const data=await request('/registrations/me');const list=data.registrations||[];$('loginSection').hidden=true;$('dashboard').hidden=false;$('welcome').textContent='Olá, '+user.name.split(' ')[0]+'!';$('profile').textContent=[user.city,user.email].filter(Boolean).join(' · ');$('count').textContent=list.length;$('pending').textContent=list.filter(x=>x.status==='awaiting_payment').length;$('paid').textContent=list.filter(x=>x.status==='paid'||x.status==='paid_simulated').length;const root=$('entries');root.replaceChildren();if(!list.length)root.textContent='Nenhuma inscrição registrada. Seu cadastro foi criado, mas você ainda não possui uma inscrição confirmada no sistema.';for(const x of list){const box=document.createElement('div');box.className='entry';const title=document.createElement('h3');title.textContent=x.race+' · '+x.distance;const detail=document.createElement('p');detail.className='muted';detail.textContent=[x.date,'Camiseta '+x.shirt_size,x.category,x.locality].filter(Boolean).join(' · ');const status=document.createElement('b');status.textContent=x.status==='awaiting_payment'?'Pagamento pendente':x.status==='paid_simulated'?'Pagamento simulado':x.status;box.append(title,detail,status);root.append(box)}msg('Acesso realizado.',true)}
function logout(){sessionStorage.removeItem('arena_run_auth_token');token='';user=null;$('dashboard').hidden=true;$('loginSection').hidden=false;$('loginForm').reset();$('message').textContent=''}
async function resumeSession(){const saved=sessionStorage.getItem('arena_run_auth_token');if(!saved){$('loginSection').hidden=false;return}token=saved;try{const account=await request('/me');if(account.role!=='runner')throw Error('Perfil incompatível');location.replace('/painel.html')}catch(e){sessionStorage.removeItem('arena_run_auth_token');token='';$('loginSection').hidden=false;if(e.message!=='Sessão inválida ou expirada'&&e.message!=='Autenticação obrigatória')msg('Não foi possível validar a sessão. Faça login novamente.')}}
resumeSession();
</script></body></html>
